<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ПУЛЬС">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/F4D03F/weightlifting.png">
    
    <title>ПУЛЬС — Твой Тренер</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --border: #222222;
            --accent: #F4D03F;
            --text: #FFFFFF;
            --text-dim: #888888;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            background: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 60px 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .brand { font-weight: 900; color: var(--accent); letter-spacing: 3px; font-size: 1.1rem; }
        .tab-indicator { color: var(--text-dim); font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px 130px;
            -webkit-overflow-scrolling: touch;
        }

        .ex-card {
            background: var(--card);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .ex-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .ex-image { width: 45px; height: 45px; filter: drop-shadow(0 0 5px rgba(244, 208, 63, 0.2)); }
        .ex-name { font-size: 1.2rem; font-weight: 700; color: #fff; }

        .set-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #1a1a1a; padding: 12px 15px; border-radius: 18px; margin-bottom: 10px;
            border: 1px solid #252525;
        }

        .set-info { font-size: 0.75rem; color: var(--text-dim); font-weight: bold; }
        
        .input-group { display: flex; align-items: center; gap: 10px; }
        .input-group input {
            background: #252525; border: 1px solid #444; color: var(--accent);
            width: 55px; padding: 8px; border-radius: 10px; text-align: center;
            font-weight: 900; font-size: 1rem;
        }

        .btn-del { background: none; border: none; color: #ff4444; font-size: 1.2rem; padding: 5px 10px; cursor: pointer; }

        .btn-add {
            width: 100%; padding: 16px; background: transparent; border: 2px dashed #333;
            color: var(--accent); border-radius: 20px; font-weight: 800; cursor: pointer;
            transition: 0.2s; font-size: 0.8rem;
        }

        /* Навигация */
        nav {
            position: absolute; bottom: 0; width: 100%; height: 95px;
            background: rgba(8, 8, 8, 0.98);
            display: flex; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom);
            z-index: 1000;
        }

        .nav-btn {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: var(--text-dim); transition: 0.3s;
        }

        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 1.3rem; margin-bottom: 4px; }
        .nav-label { font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; }

        /* Профиль */
        .profile-card {
            background: var(--card); padding: 20px; border-radius: 24px;
            margin-bottom: 15px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid var(--border);
        }
        .profile-card label { font-size: 0.9rem; color: var(--text-dim); font-weight: 600; }
        .profile-card input {
            background: #1a1a1a; border: 1px solid #333; color: var(--accent);
            padding: 10px; border-radius: 12px; width: 85px; text-align: center;
            font-weight: bold; font-size: 1rem;
        }

        input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 15px; }

        [v-cloak] { display: none; }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <header>
        <div class="brand">ПУЛЬС</div>
        <div class="tab-indicator">{{ activeTab === 0 ? 'ТРЕНИРОВКА' : 'ПРОФИЛЬ' }}</div>
    </header>

    <main>
        <div v-if="activeTab === 0">
            <div v-for="(ex, exIdx) in exercises" :key="exIdx" class="ex-card">
                <div class="ex-header">
                    <img :src="ex.img" class="ex-image" alt="icon">
                    <span class="ex-name">{{ ex.name }}</span>
                </div>
                
                <div v-for="(set, sIdx) in ex.sets" :key="sIdx" class="set-row">
                    <span class="set-info">ПОДХОД {{ sIdx + 1 }}</span>
                    <div class="input-group">
                        <input type="number" v-model="set.reps">
                        <button class="btn-del" @click="ex.sets.splice(sIdx, 1)">×</button>
                    </div>
                </div>
                
                <button class="btn-add" @click="ex.sets.push({reps: 0})">+ ДОБАВИТЬ ПОДХОД</button>
            </div>
        </div>

        <div v-if="activeTab === 1">
            <div class="profile-card"><label>Вес тела (кг)</label><input v-model="user.weight" type="number"></div>
            <div class="profile-card"><label>Рост (см)</label><input v-model="user.height" type="number"></div>
            <div class="profile-card"><label>Возраст (лет)</label><input v-model="user.age" type="number"></div>
            
            <div style="margin-top: 40px; padding: 0 10px;">
                <div style="display:flex; justify-content: space-between; align-items: baseline;">
                    <span style="color: var(--text-dim); font-size: 0.8rem; font-weight: 800;">ВРЕМЯ СНА</span>
                    <span style="color: var(--accent); font-size: 1.2rem; font-weight: 900;">{{ sleepHours }} ч</span>
                </div>
                <input type="range" v-model="sleepHours" min="0" max="12" step="0.5">
            </div>
        </div>
    </main>

    <nav>
        <div class="nav-btn" :class="{ active: activeTab === 0 }" @click="activeTab = 0">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">ТРЕНИНГ</span>
        </div>
        <div class="nav-btn" :class="{ active: activeTab === 1 }" @click="activeTab = 1">
            <span class="nav-icon">👤</span>
            <span class="nav-label">ПРОФИЛЬ</span>
        </div>
    </nav>
</div>

<script>
    const { createApp } = Vue
    createApp({
        data() {
            return {
                activeTab: 0,
                sleepHours: 8,
                user: { weight: 80, height: 180, age: 25 },
                exercises: [
                    { 
                        name: 'Подтягивания', 
                        img: 'https://img.icons8.com/ios-filled/100/F4D03F/pullups.png', 
                        sets: [{reps: 10}] 
                    },
                    { 
                        name: 'Отжимания', 
                        img: 'https://img.icons8.com/ios-filled/100/F4D03F/pushups.png', 
                        sets: [{reps: 20}] 
                    },
                    { 
                        name: 'Приседания', 
                        img: 'https://img.icons8.com/ios-filled/100/F4D03F/squats.png', 
                        sets: [{reps: 15}] 
                    },
                    { 
                        name: 'Пресс', 
                        img: 'https://img.icons8.com/ios-filled/100/F4D03F/sit-ups.png', 
                        sets: [{reps: 30}] 
                    },
                    { 
                        name: 'Бег (км)', 
                        img: 'https://img.icons8.com/ios-filled/100/F4D03F/running.png', 
                        sets: [{reps: 5}] 
                    }
                ]
            }
        }
    }).mount('#app')
</script>

</body>
</html>
